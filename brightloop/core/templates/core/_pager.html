{% if page.paginator.num_pages > 1 %}<nav class="d-flex gap-3 align-items-center mt-3 noprint">
{% if page.has_previous %}<a href="?{% for k,v in request.GET.items %}{% if k != 'page' %}{{k}}={{v}}&{% endif %}{% endfor %}page={{ page.previous_page_number }}">Previous</a>{% endif %}
<span class="text-muted">Page {{ page.number }} of {{ page.paginator.num_pages }}</span>
{% if page.has_next %}<a href="?{% for k,v in request.GET.items %}{% if k != 'page' %}{{k}}={{v}}&{% endif %}{% endfor %}page={{ page.next_page_number }}">Next</a>{% endif %}</nav>{% endif %}
